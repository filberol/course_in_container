# Воркспейс Лаб 2. Поднять:  docker compose up --build -d
# Затем открыть http://localhost:8080 — VS Code в браузере, harness в /work.
services:
  workspace:
    build: .
    privileged: true                      # нужно для Docker-in-Docker (kind внутри)
    ports:
      - "127.0.0.1:${CODE_PORT:-8080}:8080"   # фронт code-server (порт хоста настраиваемый)
      - "127.0.0.1:30080:30080"               # NodePort приложения при желании
    volumes:
      - ../:/work                          # весь harness Лаб 2 монтируется в /work
      - dind-data:/var/lib/docker          # кэш образов между перезапусками

volumes:
  dind-data:
