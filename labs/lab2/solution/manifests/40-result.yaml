apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: ${NS}
  labels: { app: result }
spec:
  replicas: 1
  selector: { matchLabels: { app: result } }
  template:
    metadata: { labels: { app: result } }
    spec:
      containers:
        - name: result
          image: dockersamples/examplevotingapp_result:before
          ports: [ { containerPort: 80 } ]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: result
  namespace: ${NS}
  labels: { app: result }
spec:
  selector: { app: result }
  ports: [ { port: 80, targetPort: 80 } ]
