<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр лаб</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="/vendor/codemirror.min.css">
<style>
  :root {
    /* палитра ITMO (из slides/theme) */
    --blue:#0b68fe; --cyan:#00ccff; --orange:#f93f37; --yellow:#ffcc33;
    --blue-deep:#0a4fc2; --navy:#06214f; --ink:#16263d;
    --sky:#edf4ff; --sky-line:#c9ddff; --cyan-tint:#dff7ff;
    --ok:#0f9d58; --bad:var(--orange); --mut:#5f74a0;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;
         background:#fff; color:var(--ink); height:100vh; overflow:hidden;
         display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:9px 16px;
           background:#fff; border-bottom:1px solid var(--sky-line); }
  header h1 { font-size:15px; margin:0; font-weight:700; color:var(--navy); white-space:nowrap; }
  header a.home { color:var(--blue); text-decoration:none; font-size:13px; white-space:nowrap; }
  header a.home:hover { text-decoration:underline; }
  header .sp { flex:1; }
  input, button, select { font:inherit; border-radius:8px; border:1px solid var(--sky-line); }
  input, select { background:#fff; color:var(--ink); padding:6px 10px; }
  input { width:120px; }
  button { background:var(--blue); color:#fff; border:none; padding:7px 14px; cursor:pointer; }
  button.ghost { background:var(--sky); color:var(--blue-deep); border:1px solid var(--sky-line); }
  button.mini { padding:4px 10px; font-size:12px; margin-top:8px; }
  button:disabled { opacity:.5; cursor:default; }
  .badge { padding:4px 10px; border-radius:20px; font-size:12px; background:var(--sky); color:var(--mut); }
  .badge.ok { background:rgba(15,157,88,.12); color:var(--ok); }
  .badge.bad { background:#fff1f0; color:var(--bad); }
  .cluster { font-size:12px; color:var(--mut); padding:5px 16px; background:var(--sky);
             border-bottom:1px solid var(--sky-line); }
  .cluster b { color:var(--navy); }
  .cluster .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
                  background:var(--bad); margin-right:6px; vertical-align:middle; }
  .cluster.up .dot { background:var(--ok); }
  main { flex:1; display:flex; min-height:0; }
  .instr { width:38%; overflow:auto; padding:16px; border-right:1px solid var(--sky-line); }
  .work  { flex:1; display:flex; flex-direction:column; min-width:0; }
  .params { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .params span { background:var(--sky); border:1px solid var(--sky-line); border-radius:6px;
                 padding:3px 8px; font-size:12px; color:var(--mut); }
  .params b { color:var(--navy); }
  details { margin-bottom:12px; }
  details > summary { cursor:pointer; color:var(--blue-deep); font-weight:600; }
  .log pre { margin:6px 0 0; padding:10px; background:#0b0d13; border-radius:8px; max-height:200px;
             overflow:auto; white-space:pre-wrap; font:12px/1.45 ui-monospace,monospace; color:#cdd3e6; }
  .task { background:#fff; border:1px solid var(--sky-line); border-radius:12px;
          margin-bottom:12px; box-shadow:0 1px 2px rgba(6,33,79,.04);
          display:flex; flex-direction:column; }
  .task .body { padding:12px 14px; }
  .task h3 { margin:0 0 6px; font-size:14px; color:var(--navy); }
  .task p { margin:0 0 8px; color:var(--ink); }
  details.hint { margin:4px 0; }
  details.hint > summary { color:var(--blue); font-weight:400; font-size:13px; }
  details.hint p { margin:6px 0 0; color:var(--mut); font-size:13px; }
  /* нижняя панель: сегменты-контракты + «Проверить»; нижние углы скруглены как верх */
  .taskbar { display:flex; border-top:1px solid var(--sky-line); }
  .seg { flex:1; min-width:0; display:flex; align-items:center; justify-content:center;
         padding:8px 6px; color:var(--mut); border-right:1px solid var(--sky-line); position:relative; }
  .seg:last-child { border-right:none; }
  .seg:first-child { border-bottom-left-radius:12px; }
  .seg:last-child  { border-bottom-right-radius:12px; }
  .seg .lbl { font-size:12px; min-width:0; max-width:100%; text-align:center; line-height:1.25;
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .seg.ok  { background:rgba(15,157,88,.10); color:var(--ok); }
  .seg.bad { background:#fff1f0; color:var(--bad); }
  .seg.act { flex:0 0 auto; padding:8px 16px; background:var(--blue); color:#fff; font-weight:600; cursor:pointer; }
  .seg.act:hover { background:var(--blue-deep); }
  body.checking .seg.act { pointer-events:none; opacity:.55; }
  .seg[data-tip]:hover::after { content:attr(data-tip); position:absolute; left:50%; bottom:100%;
         transform:translateX(-50%); margin-bottom:9px; background:var(--navy); color:#fff;
         padding:6px 10px; border-radius:8px; font-size:12px; line-height:1.35; text-align:left;
         width:max-content; max-width:220px; white-space:normal; z-index:6;
         box-shadow:0 6px 18px rgba(6,33,79,.25); }
  .seg[data-tip]:hover::before { content:''; position:absolute; left:50%; bottom:100%;
         transform:translateX(-50%); margin-bottom:3px; border:6px solid transparent;
         border-top-color:var(--navy); z-index:6; }
  /* рабочая зона */
  .top { flex:1.1; min-height:0; display:flex; }
  .filetree { width:190px; border-right:1px solid var(--sky-line); display:flex; flex-direction:column;
              background:var(--sky); }
  .ftbar { display:flex; gap:4px; padding:6px; border-bottom:1px solid var(--sky-line); }
  .ftbar button { padding:3px 8px; font-size:12px; }
  #tree { flex:1; overflow:auto; padding:4px 0; font-size:13px; }
  .trow { display:flex; align-items:center; gap:4px; padding:2px 8px 2px 6px; cursor:pointer; white-space:nowrap; }
  .trow:hover { background:var(--cyan-tint); }
  .trow.sel { background:#fff; }
  .trow.dir .nm { font-weight:700; color:var(--navy); }
  .trow .nm { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .trow .del { color:var(--mut); visibility:hidden; font-size:12px; }
  .trow:hover .del { visibility:visible; }
  .editorbox { flex:1; display:flex; flex-direction:column; min-width:0; }
  .filepath { font:12px/1 ui-monospace,monospace; color:var(--mut); padding:6px 10px;
              border-bottom:1px solid var(--sky-line); background:#fff; }
  .editor-wrap { flex:1; min-height:0; display:flex; }
  .CodeMirror { flex:1; height:auto; font-size:13px; }
  .termhead { font-size:12px; color:var(--mut); padding:6px 12px; background:var(--sky);
              border-top:1px solid var(--sky-line); border-bottom:1px solid var(--sky-line); }
  .termhead code { color:var(--blue-deep); }
  .term-wrap { flex:1.1; min-height:0; }
  iframe.term { display:block; width:100%; height:100%; border:0; background:#000; }
</style>
</head>
<body>
<header>
  <h1>Тренажёр лаб</h1>
  <a class="home" href="https://filberol.github.io/course_in_container/" target="_blank" rel="noopener">Главная ↗</a>
  <select id="lab" title="Выбор лабораторной"></select>
  <input id="isu" title="Вариант" placeholder="Вариант">
  <button class="ghost" id="saveIsu">Сохранить</button>
  <span class="sp"></span>
  <span id="gate" class="badge">Не проверено</span>
  <button id="check">Проверить</button>
  <button id="stop" style="display:none;background:var(--orange)">Стоп</button>
</header>
<div class="cluster" id="cluster"><span class="dot"></span>Кластер: проверяю…</div>
<main>
  <section class="instr">
    <div class="params" id="params"></div>
    <details class="log"><summary>Лог проверки</summary><pre id="log">Выбери лабу, укажи вариант и нажми «Проверить».</pre></details>
    <div id="tasks"></div>
  </section>
  <section class="work">
    <div class="top">
      <div class="filetree">
        <div class="ftbar">
          <button class="ghost" onclick="newFile()">Файл</button>
          <button class="ghost" onclick="newDir()">Папка</button>
        </div>
        <div id="tree"></div>
      </div>
      <div class="editorbox">
        <div class="filepath" id="filepath">— выбери файл слева —</div>
        <div class="editor-wrap"><textarea id="editor"></textarea></div>
      </div>
    </div>
    <div class="termhead" id="termhead">Терминал — кластер и манифесты поднимаешь сам.</div>
    <div class="term-wrap"><iframe class="term" id="term"></iframe></div>
  </section>
</main>

<script src="/vendor/codemirror.min.js"></script>
<script src="/vendor/yaml.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const cid = id => 'chk-' + id.replace('.', '-');
let cm, currentPath = null, poll = null, saveTimer = null;

cm = CodeMirror.fromTextArea($('#editor'), { lineNumbers:true, indentUnit:2, tabSize:2 });
cm.on('change', () => {
  if (!currentPath) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCurrent, 700);
});
async function saveCurrent() {
  await fetch('/api/file', { method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ path: currentPath, content: cm.getValue() }) });
}
const modeFor = p => /\.ya?ml$/.test(p) ? 'yaml' : null;

async function openPath(path) {
  const r = await (await fetch('/api/file?path=' + encodeURIComponent(path))).json();
  currentPath = path;
  cm.setOption('mode', modeFor(path));
  cm.setValue(r.content || '');
  $('#filepath').textContent = path;
  document.querySelectorAll('.trow').forEach(x => x.classList.toggle('sel', x.dataset.path === path));
}

async function loadTree() {
  const t = (await (await fetch('/api/tree')).json()).tree;
  const el = $('#tree'); el.innerHTML = '';
  t.forEach(it => {
    const depth = it.path.split('/').length - 1;
    const name = it.path.split('/').pop();
    const row = document.createElement('div');
    row.className = 'trow ' + it.type + (it.path === currentPath ? ' sel' : '');
    row.dataset.path = it.path;
    row.style.paddingLeft = (6 + depth * 14) + 'px';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = name;
    const del = document.createElement('span'); del.className = 'del'; del.textContent = '✕'; del.title = 'удалить';
    row.append(nm, del);
    nm.onclick = () => { if (it.type === 'file') openPath(it.path); };
    nm.ondblclick = () => rename(it.path);
    del.onclick = e => { e.stopPropagation(); rm(it.path); };
    el.appendChild(row);
  });
  if (currentPath && !t.some(i => i.path === currentPath)) {
    currentPath = null; cm.setValue(''); $('#filepath').textContent = '— выбери файл слева —';
  }
}

async function newFile() {
  const p = prompt('Путь нового файла (можно вложенный):', 'manifests/new.yaml');
  if (!p) return;
  await fetch('/api/file', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ path:p, content:'' }) });
  await loadTree(); openPath(p);
}
async function newDir() {
  const p = prompt('Путь новой папки:', 'manifests');
  if (!p) return;
  await fetch('/api/mkdir', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ path:p }) });
  loadTree();
}
async function rm(path) {
  if (!confirm('Удалить ' + path + '?')) return;
  await fetch('/api/rm', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ path }) });
  loadTree();
}
async function rename(path) {
  const to = prompt('Новый путь:', path);
  if (!to || to === path) return;
  await fetch('/api/mv', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ from:path, to }) });
  if (currentPath === path) currentPath = to;
  loadTree();
}
window.newFile = newFile; window.newDir = newDir;

function renderParams(p) {
  $('#params').innerHTML = Object.entries(p)
    .filter(([k]) => k !== 'ISU' && k !== 'BREAKFIX_ID')
    .map(([k, v]) => `<span>${k}: <b>${v}</b></span>`).join('');
}
function renderTasks(tasks, labels, hints) {
  $('#tasks').innerHTML = tasks.map(t => `
    <div class="task">
      <div class="body">
        <h3>${t.title}</h3>
        <p>${t.body}</p>
      </div>
      <div class="taskbar">
        ${t.checks.map(c => `<div class="seg" id="${cid(c)}" data-tip="${(hints[c]||labels[c]||c).replace(/"/g,'&quot;')}"><span class="lbl">${labels[c] || c}</span></div>`).join('')}
        <div class="seg act" onclick="checkSuite('${t.id}')">Проверить</div>
      </div>
    </div>`).join('');
}
function renderLabs(labs, active) {
  $('#lab').innerHTML = labs.map(l => `<option value="${l.id}" ${l.id===active?'selected':''}>${l.title}</option>`).join('');
}

async function load() {
  const s = await (await fetch('/api/state')).json();
  renderLabs(s.labs, s.lab);
  $('#isu').value = s.isu || '';
  renderParams(s.params);
  renderTasks(s.tasks, s.labels, s.hints || {});
  $('#termhead').innerHTML = s.terminal_hint
    ? 'Терминал (в рабочей директории): <code>' + s.terminal_hint + '</code>'
    : 'Терминал — кластер и манифесты поднимаешь сам.';
  $('#term').src = location.protocol + '//' + location.hostname + ':' + s.ttyd_port + '?t=' + Date.now();
  await loadTree();
}

$('#lab').onchange = async () => {
  await fetch('/api/lab', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ lab: $('#lab').value }) });
  currentPath = null; await load();
};
$('#saveIsu').onclick = async () => {
  await fetch('/api/isu', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ isu: $('#isu').value.trim() }) });
  await load();
};

async function refreshCluster() {
  try {
    const c = await (await fetch('/api/cluster')).json();
    const el = $('#cluster');
    if (c.reachable) {
      const ready = c.pods.filter(p => p.status === 'Running' && p.ready.split('/')[0] === p.ready.split('/')[1]).length;
      el.className = 'cluster up';
      el.innerHTML = `<span class="dot"></span>Кластер: <b>${c.context||'—'}</b> · подов готово ${ready}/${c.pods.length}`;
    } else {
      el.className = 'cluster';
      el.innerHTML = `<span class="dot"></span>Кластер не найден — создай его в терминале ниже`;
    }
  } catch (e) {}
}

function setGate(g) {
  const el = $('#gate');
  el.className = 'badge ' + (g === 'admitted' ? 'ok' : g === 'blocked' ? 'bad' : '');
  el.textContent = g === 'admitted' ? 'Допущен' : g === 'blocked' ? 'Есть красное' : 'Проверка…';
}
function applyResults(res) {
  if (!res) return;
  for (const [id, ok] of Object.entries(res)) {
    const el = document.getElementById(cid(id));
    if (el) el.className = 'seg ' + (ok ? 'ok' : 'bad');
  }
}
async function checkRun(suite) {
  const r = await fetch('/api/check', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(suite ? { suite } : {}) });
  if (!r.ok) { const e = await r.json(); $('#log').textContent = e.error || 'ошибка'; document.querySelector('details.log').open = true; return; }
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  document.body.classList.add('checking');
  $('#stop').disabled = false; $('#stop').style.display = '';
  if (!suite) { setGate(null); document.querySelectorAll('.seg:not(.act)').forEach(c => c.className = 'seg'); }
  document.querySelector('details.log').open = true;
  clearInterval(poll);
  poll = setInterval(async () => {
    const st = await (await fetch('/api/check')).json();
    $('#log').textContent = st.log.join('\n');
    $('#log').scrollTop = $('#log').scrollHeight;
    applyResults(st.results);
    if (st.done) { clearInterval(poll); document.querySelectorAll('button').forEach(b => b.disabled = false); document.body.classList.remove('checking'); $('#stop').style.display = 'none'; if (!suite) setGate(st.gate); }
  }, 1500);
}
window.checkSuite = checkRun;
$('#check').onclick = () => checkRun(null);
$('#stop').onclick = async () => { $('#stop').disabled = true; await fetch('/api/check/stop', { method:'POST' }); };

load();
refreshCluster();
setInterval(refreshCluster, 6000);
</script>
</body>
</html>
