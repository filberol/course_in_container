# SLI/SLO для example-voting-app (сервис vote). Заполни по своему варианту.
# Требование: определить SLI, целевой SLO и бюджет ошибок В МИНУТАХ — добавь ключ
# error_budget_minutes (проверяется дословно): (1 - SLO/100) * window_days * 24 * 60.
#
# Пример структуры (раскомментируй и заполни):
# service: vote
# sli: доступность — доля ответов 2xx на GET /
# slo: 99.0               # целевой процент из твоего варианта
# window_days: 30
# error_budget_minutes:   # посчитай сам
